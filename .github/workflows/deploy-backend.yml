name: Deploy Backend to HF Spaces

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync backend/ to HF Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          git clone \
            https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} \
            hf-space
          rsync -av --delete \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.py[cod]' \
            --exclude='*.db' \
            --exclude='**/chroma_db/' \
            --exclude='.ruff_cache/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='README.md' \
            --exclude='data/' \
            backend/ hf-space/
          cd hf-space
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --quiet --staged; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "deploy: sync backend from ${GITHUB_SHA}"
          git push https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} main
