[project]
name = "backend"
version = "0.1.0"
description = "SafeShelf Backend API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "greenlet>=3.1.1",
    "fastapi[standard]>=0.136.3",
    "langchain[openai]>=1.3.7",
    "langgraph>=1.2.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8.1",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",
    "zxing-cpp>=2.3.0",
    "Pillow>=11.0.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=6.13.2",
    "torch>=2.12.0",
    "langchain-groq>=1.1.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

